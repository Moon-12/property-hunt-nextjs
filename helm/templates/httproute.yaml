apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
	name: property-hunt-nextjs-httproute
	namespace: twinkle-ns
  annotations:
    # This annotation tells Cilium to use the specific load balancer pool for this route.
    io.cilium/lb-pool: "cilium-lb-pool1"
spec:
	parentRefs:
		- name: property-hunt-nextjs-gateway # Update this to your Gateway name if different
			namespace: twinkle-ns
	hostnames:
		- ashwija.example.com
	rules:
		- matches:
				- path:
						type: PathPrefix
						value: /property-hunt
			backendRefs:
				- name: property-hunt-nextjs-service
					port: 80
